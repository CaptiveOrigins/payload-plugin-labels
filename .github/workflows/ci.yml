name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
permissions:
  contents: read
# Keeps Actions minutes low: one run per change, drafts skipped, a timeout.
# The leak check runs in its own workflow (leak-check.yml) on every change, docs included.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        if: hashFiles('package.json') != ''
        with:
          node-version: 24
          cache: npm
      # Until the code lands (after tour v3) the repo holds only docs: skip rather than fail.
      - run: npm ci
        if: hashFiles('package.json') != ''
      - run: npm run typecheck
        if: hashFiles('package.json') != ''
      - run: npm test
        if: hashFiles('package.json') != ''
      - run: npm run build
        if: hashFiles('package.json') != ''
